services:

  # ─── PostgreSQL with pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: checkpoint-postgres
    environment:
      POSTGRES_DB: checkpoint_ai
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint -d checkpoint_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Temporal server ───────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:latest
    container_name: checkpoint-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=checkpoint
      - POSTGRES_PWD=checkpoint
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Temporal Web UI ───────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:latest
    container_name: checkpoint-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  # ─── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: checkpoint-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # ─── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: checkpoint-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data: